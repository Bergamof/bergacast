spring:
  application:
    name: bergacast
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bergacast}
    username: ${SPRING_DATASOURCE_USERNAME:bergacast}
    password: ${SPRING_DATASOURCE_PASSWORD:bergacast}
    # Serverless: no connection kept open "just in case", so that an idle database (Serverless SQL) can pause.
    # Bound to HikariConfig's setters as is: durations are in milliseconds (30 s, 10 min).
    hikari:
      minimum-idle: 0
      idle-timeout: 30000
      maximum-pool-size: 5
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Maximum audio file size; the request limit adds some room for the metadata (see MultipartConfiguration).
      max-file-size: ${BERGACAST_MAX_UPLOAD_SIZE:500MB}
      # Parts are written to a temporary file as soon as they arrive, never kept in memory.
      file-size-threshold: 0
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # Only robots.txt: the admin SPA is a separate image, the media are on the object storage.
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          max-age: 1d
          cache-public: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  # Serverless platforms (Scaleway Serverless Containers) give the port to listen on in PORT.
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Public on purpose, including in production, to help plugging external tools.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/hal+json
  writer-with-order-by-keys: true

bergacast:
  public-base-url: ${BERGACAST_PUBLIC_BASE_URL:http://localhost:8080}
  # Public URL of the bucket (or of a CDN in front of it): feeds, audio files and images are served from there.
  media-base-url: ${BERGACAST_MEDIA_BASE_URL:}
  storage:
    endpoint: ${BERGACAST_STORAGE_ENDPOINT:https://s3.fr-par.scw.cloud}
    region: ${BERGACAST_STORAGE_REGION:fr-par}
    bucket: ${BERGACAST_STORAGE_BUCKET:}
    access-key: ${BERGACAST_STORAGE_ACCESS_KEY:}
    secret-key: ${BERGACAST_STORAGE_SECRET_KEY:}
  jwt:
    secret: ${BERGACAST_JWT_SECRET:}
    lifetime: 15m
  # Largest podcast cover image accepted for upload (images larger than 3000 px are then downscaled).
  max-image-upload-size: ${BERGACAST_MAX_IMAGE_UPLOAD_SIZE:20MB}
  cors:
    # Comma-separated origins of the admin SPA, e.g. https://admin.example.com
    allowed-origins: ${BERGACAST_CORS_ALLOWED_ORIGINS:}
  admin:
    username: ${BERGACAST_ADMIN_USERNAME:}
    password: ${BERGACAST_ADMIN_PASSWORD:}
