# Conventional Commits messages (also the PR titles): `ci(deps)` for workflows, `build(deps)` / `build(deps-dev)`
# for the modules, released as a patch version.
version: 2
updates:
  # Actions are pinned by commit SHA (with the version in a comment): Dependabot updates both.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/trivy-scan
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: gradle
    directory: /migration
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Liquibase 5 and later are under the Functional Source License (not open source, not compatible with the AGPL
      # of this project): stay on the Apache-2.0 4.x line.
      - dependency-name: org.liquibase:liquibase-core
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # @vitest/* packages pin vitest as an exact peer dependency: bumping them separately breaks `npm ci`.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # TypeScript 7 not yet supported by @sveltejs/kit, svelte-check and typescript-eslint (peer dependencies).
      # Remove once they accept it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /backend
      - /migration
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
