version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # @vitest/* packages pin vitest as an exact peer dependency: bumping them separately breaks `npm ci`.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # TypeScript 7 not yet supported by @sveltejs/kit, svelte-check and typescript-eslint (peer dependencies).
      # Remove once they accept it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
