# Conventional Commits messages (also the PR titles): `ci(deps)` for workflows, `build(deps)` / `build(deps-dev)`
# for the modules, released as a patch version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # @vitest/* packages pin vitest as an exact peer dependency: bumping them separately breaks `npm ci`.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
    ignore:
      # TypeScript 7 not yet supported by @sveltejs/kit, svelte-check and typescript-eslint (peer dependencies).
      # Remove once they accept it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
