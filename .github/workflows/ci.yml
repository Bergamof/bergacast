name: CI

on:
  pull_request:
    # `edited`: the PR title becomes the squash commit message, from which the release version is computed.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # Daily security scans of main (new CVEs appear without any code change): see the jobs without the
  # `github.event_name != 'schedule'` condition.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash enables `-o pipefail`, so `cmd | tee log` keeps the exit status of `cmd`.
    shell: bash

env:
  SPECTRAL_CLI_VERSION: 6.17.0
  # Run through npx, like Spectral, rather than as a dev dependency: its dependency tree (puppeteer, proxy-agent…)
  # carries unfixed high vulnerabilities that would fail npm audit, while it only ever audits our local pages in CI.
  LHCI_CLI_VERSION: 0.15.1

# Every verification job publishes a one-line `summary` output (plus a few detailed ones), computed in a step
# that runs `if: always()` so the outputs exist even when the verification fails. The `report` job gathers them.
jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conventional Commits title
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-title.sh "$PR_TITLE"
      - name: Summarize
        id: summary
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          case "$OUTCOME" in
            success) summary="Conventional Commits title" ;;
            failure) summary="not a Conventional Commits title (<type>[(scope)][!]: <description>)" ;;
            *) summary="not checked" ;;
          esac
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  release-scripts:
    name: Release scripts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update --quiet && sudo apt-get install --yes --no-install-recommends bats
      - name: ShellCheck
        id: shellcheck
        run: shellcheck --external-sources .github/scripts/*.sh .github/scripts/*.bash .github/scripts/tests/*.bash
      - name: Bats tests
        id: bats
        if: ${{ !cancelled() }}
        run: bats --tap .github/scripts/tests | tee "$RUNNER_TEMP/bats.tap"
      - name: Summarize
        id: summary
        if: always()
        env:
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
          TAP_FILE: ${{ runner.temp }}/bats.tap
        run: |
          case "$SHELLCHECK_OUTCOME" in
            success) shellcheck_summary="ShellCheck: ok" ;;
            failure) shellcheck_summary="ShellCheck: issues" ;;
            *) shellcheck_summary="ShellCheck: not run" ;;
          esac
          if [ -f "$TAP_FILE" ]; then
            passed=$(grep -c '^ok ' "$TAP_FILE" || true)
            failed=$(grep -c '^not ok ' "$TAP_FILE" || true)
            bats_summary="bats: ${passed} passed, ${failed} failed"
          else
            bats_summary="bats: not run"
          fi
          summary="$shellcheck_summary · $bats_summary"
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  backend-lint:
    name: Backend lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      checkstyle-violations: ${{ steps.summary.outputs.checkstyle-violations }}
      spotless: ${{ steps.summary.outputs.spotless }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
            migration/*.gradle*
            migration/gradle/wrapper/gradle-wrapper.properties
      - name: Spotless and Checkstyle
        working-directory: backend
        run: ./gradlew --continue --console=plain spotlessCheck checkstyleMain checkstyleTest 2>&1 | tee "$RUNNER_TEMP/backend-lint.log"
      - name: Summarize
        id: summary
        if: always()
        env:
          LOG_FILE: ${{ runner.temp }}/backend-lint.log
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET

          reports = glob.glob("backend/build/reports/checkstyle/*.xml")
          violations = 0
          for path in reports:
              try:
                  violations += sum(1 for _ in ET.parse(path).getroot().iter("error"))
              except ET.ParseError:
                  pass
          log = open(os.environ["LOG_FILE"], encoding="utf-8").read() if os.path.isfile(os.environ["LOG_FILE"]) else ""
          if re.search(r"Task :spotless\w*Check FAILED", log):
              spotless = "violations"
          elif re.search(r"Task :spotless\w*Check", log):
              spotless = "ok"
          else:
              spotless = "not run"
          checkstyle = f"{violations} violation(s)" if reports else "not run"
          summary = f"Spotless: {spotless} · Checkstyle: {checkstyle}"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\ncheckstyle-violations={violations if reports else ''}\nspotless={spotless}\n")
          PY

  backend-test:
    name: Backend tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      line-coverage: ${{ steps.summary.outputs.line-coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
            migration/*.gradle*
            migration/gradle/wrapper/gradle-wrapper.properties
      - name: Tests (Testcontainers PostgreSQL) and JaCoCo report
        working-directory: backend
        run: ./gradlew test
      - name: Summarize
        id: summary
        if: always()
        env:
          JUNIT_GLOB: backend/build/test-results/test/*.xml
          JACOCO_XML: backend/build/reports/jacoco/test/jacocoTestReport.xml
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          tests = failed = skipped = 0
          files = glob.glob(os.environ["JUNIT_GLOB"])
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for suite in [root] if root.tag == "testsuite" else root.iter("testsuite"):
                  tests += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
          passed = tests - failed - skipped

          coverage = ""
          if os.path.isfile(os.environ["JACOCO_XML"]):
              for counter in ET.parse(os.environ["JACOCO_XML"]).getroot().findall("counter"):
                  if counter.get("type") == "LINE":
                      missed, covered = int(counter.get("missed")), int(counter.get("covered"))
                      coverage = f"{100 * covered / (missed + covered):.1f}" if missed + covered else "0.0"

          if files:
              summary = f"{passed} passed, {failed} failed, {skipped} skipped"
              summary += f" · line coverage {coverage}%" if coverage else " · no coverage report"
          else:
              summary = "no test report"
              passed = failed = skipped = ""
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\npassed={passed}\nfailed={failed}\nskipped={skipped}\nline-coverage={coverage}\n")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
            migration/*.gradle*
            migration/gradle/wrapper/gradle-wrapper.properties
      - name: Boot jar
        working-directory: backend
        run: ./gradlew bootJar
      - name: Keep the jar for the dependency scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
      - name: Summarize
        id: summary
        if: always()
        run: |
          shopt -s nullglob
          jars=(backend/build/libs/*.jar)
          if [ "${#jars[@]}" -gt 0 ]; then
            summary="$(basename "${jars[0]}") ($(numfmt --to=iec-i --suffix=B "$(stat -c %s "${jars[0]}")"))"
          else
            summary="no jar produced"
          fi
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  openapi-lint:
    name: OpenAPI lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      errors: ${{ steps.summary.outputs.errors }}
      warnings: ${{ steps.summary.outputs.warnings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
            migration/*.gradle*
            migration/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate the OpenAPI document (boots the app against Testcontainers PostgreSQL)
        working-directory: backend
        run: ./gradlew generateOpenApiSpec
      - name: Spectral
        run: >-
          npx --yes "@stoplight/spectral-cli@${SPECTRAL_CLI_VERSION}" lint backend/build/openapi.json
          --ruleset .spectral.yaml --fail-severity=warn
          --format=stylish --format=json --output.json="$RUNNER_TEMP/spectral.json"
      - name: Summarize
        id: summary
        if: always()
        env:
          SPECTRAL_JSON: ${{ runner.temp }}/spectral.json
        run: |
          python3 - <<'PY'
          import json, os

          errors = warnings = infos = ""
          if not os.path.isfile("backend/build/openapi.json"):
              summary = "OpenAPI document not generated"
          elif not os.path.isfile(os.environ["SPECTRAL_JSON"]):
              summary = "Spectral did not run"
          else:
              results = json.load(open(os.environ["SPECTRAL_JSON"], encoding="utf-8"))
              severities = [r.get("severity") for r in results]
              errors, warnings = severities.count(0), severities.count(1)
              infos = len(severities) - errors - warnings
              summary = f"Spectral: {errors} error(s), {warnings} warning(s), {infos} info/hint(s)"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\nerrors={errors}\nwarnings={warnings}\n")
          PY

  frontend-lint:
    name: Frontend lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      prettier-issues: ${{ steps.summary.outputs.prettier-issues }}
      eslint-errors: ${{ steps.summary.outputs.eslint-errors }}
      svelte-check-errors: ${{ steps.summary.outputs.svelte-check-errors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the npm version pinned by packageManager
        working-directory: frontend
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        id: install
        working-directory: frontend
        run: npm ci
      - name: Prettier and ESLint
        id: lint
        working-directory: frontend
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - name: svelte-check
        id: check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: frontend
        run: npm run check -- --output machine 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Summarize
        id: summary
        if: always()
        env:
          LINT_LOG: ${{ runner.temp }}/lint.log
          CHECK_LOG: ${{ runner.temp }}/check.log
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          python3 - <<'PY'
          import os, re

          def read(name):
              path = os.environ[name]
              return open(path, encoding="utf-8").read() if os.path.isfile(path) else None

          outputs = {"prettier-issues": "", "eslint-errors": "", "svelte-check-errors": ""}
          parts = []
          lint = read("LINT_LOG")
          if lint is None:
              parts += ["Prettier: not run", "ESLint: not run"]
          else:
              prettier = sum(
                  1 for line in lint.splitlines()
                  if re.match(r"\[(warn|error)\] ", line) and "Code style issues" not in line
              )
              outputs["prettier-issues"] = prettier
              parts.append(f"Prettier: {prettier} file(s) to format")
              eslint = re.search(r"(\d+) problems? \((\d+) errors?, (\d+) warnings?\)", lint)
              if eslint:
                  outputs["eslint-errors"] = eslint.group(2)
                  parts.append(f"ESLint: {eslint.group(2)} error(s), {eslint.group(3)} warning(s)")
              elif prettier and os.environ["LINT_OUTCOME"] == "failure":
                  parts.append("ESLint: not run")
              else:
                  outputs["eslint-errors"] = 0
                  parts.append("ESLint: 0 error(s), 0 warning(s)")
          check = read("CHECK_LOG")
          found = re.search(r"COMPLETED \d+ FILES (\d+) ERRORS (\d+) WARNINGS", check or "")
          if found:
              outputs["svelte-check-errors"] = found.group(1)
              parts.append(f"svelte-check: {found.group(1)} error(s), {found.group(2)} warning(s)")
          else:
              parts.append("svelte-check: not run" if check is None else "svelte-check: no result")
          outputs["summary"] = " · ".join(parts)
          print(outputs["summary"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.writelines(f"{key}={value}\n" for key, value in outputs.items())
          PY

  frontend-test:
    name: Frontend tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      line-coverage: ${{ steps.summary.outputs.line-coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the npm version pinned by packageManager
        working-directory: frontend
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Vitest with coverage
        working-directory: frontend
        run: >-
          npm run test --
          --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/frontend-junit.xml"
          --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary
      - name: Summarize
        id: summary
        if: always()
        env:
          JUNIT_XML: ${{ runner.temp }}/frontend-junit.xml
          COVERAGE_JSON: frontend/coverage/coverage-summary.json
        run: |
          python3 - <<'PY'
          import json, os
          import xml.etree.ElementTree as ET

          tests = failed = skipped = 0
          report = os.path.isfile(os.environ["JUNIT_XML"])
          if report:
              root = ET.parse(os.environ["JUNIT_XML"]).getroot()
              for suite in [root] if root.tag == "testsuite" else root.iter("testsuite"):
                  tests += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
          passed = tests - failed - skipped

          coverage = ""
          if os.path.isfile(os.environ["COVERAGE_JSON"]):
              total = json.load(open(os.environ["COVERAGE_JSON"], encoding="utf-8"))["total"]["lines"]
              coverage = f"{total['pct']:.1f}" if isinstance(total.get("pct"), (int, float)) else ""

          if report:
              summary = f"{passed} passed, {failed} failed, {skipped} skipped"
              summary += f" · line coverage {coverage}%" if coverage else " · no coverage report"
          else:
              summary = "no test report"
              passed = failed = skipped = ""
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\npassed={passed}\nfailed={failed}\nskipped={skipped}\nline-coverage={coverage}\n")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-reports
          path: |
            ${{ runner.temp }}/frontend-junit.xml
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the npm version pinned by packageManager
        working-directory: frontend
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Vite build
        working-directory: frontend
        run: npm run build
      - name: Summarize
        id: summary
        if: always()
        run: |
          if [ -d frontend/build ]; then
            files=$(find frontend/build -type f | wc -l)
            size=$(numfmt --to=iec-i --suffix=B "$(du -sb frontend/build | cut -f1)")
            summary="${files} file(s), ${size}"
          else
            summary="no build output"
          fi
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  backend-dependencies:
    name: Backend dependencies (CVE)
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The jar holds every runtime dependency (the native image has no SBOM that Trivy could read).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: ${{ runner.temp }}/backend-jar
      - name: Trivy
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: rootfs
          target: ${{ runner.temp }}/backend-jar
          summary-file: ${{ runner.temp }}/trivy.summary
      - name: Summarize
        id: summary
        if: always()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/trivy.summary
        run: |
          summary=$(cat "$SUMMARY_FILE" 2>/dev/null || echo "Trivy: not run")
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  frontend-dependencies:
    name: Frontend dependencies (CVE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the npm version pinned by packageManager
        working-directory: frontend
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      # Development dependencies are audited too: they run in CI and on the developers' machines.
      - name: npm audit
        id: audit
        working-directory: frontend
        run: |
          npm audit --package-lock-only --omit=dev --json > "$RUNNER_TEMP/audit-prod.json" || true
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit-all.json" || true
          npm audit --package-lock-only --audit-level=high
      - name: Summarize
        id: summary
        if: always()
        env:
          PROD_JSON: ${{ runner.temp }}/audit-prod.json
          ALL_JSON: ${{ runner.temp }}/audit-all.json
        run: |
          python3 - <<'PY'
          import json, os

          def counts(name):
              try:
                  return json.load(open(os.environ[name], encoding="utf-8"))["metadata"]["vulnerabilities"]
              except (OSError, ValueError, KeyError):
                  return None

          prod, everything = counts("PROD_JSON"), counts("ALL_JSON")
          if prod is None or everything is None:
              summary = "npm audit: no result"
          else:
              summary = (
                  f"npm audit: production {prod['total']} · all {everything['critical']} critical,"
                  f" {everything['high']} high, {everything['moderate']} moderate, {everything['low']} low"
              )
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\n")
          PY

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installed from the release with a pinned checksum (gitleaks-action needs a license for organizations).
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # Whole history; false positives are listed in .gitleaksignore.
      - name: gitleaks
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1
          --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
          2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
      - name: Summarize
        id: summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/gitleaks.json
          LOG_FILE: ${{ runner.temp }}/gitleaks.log
        run: |
          python3 - <<'PY'
          import json, os, re

          log = open(os.environ["LOG_FILE"], encoding="utf-8").read() if os.path.isfile(os.environ["LOG_FILE"]) else ""
          commits = re.search(r"(\d+) commits scanned", log)
          ignored = sum(
              1 for line in open(".gitleaksignore", encoding="utf-8") if line.strip() and not line.startswith("#")
          )
          if os.path.isfile(os.environ["REPORT"]) and commits:
              leaks = len(json.load(open(os.environ["REPORT"], encoding="utf-8")))
              summary = f"gitleaks: {leaks} leak(s) in {commits.group(1)} commit(s) · {ignored} known false positive(s)"
          else:
              summary = "gitleaks: not run"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\n")
          PY

  codeql:
    name: CodeQL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build: Java is extracted from the sources (a Gradle build would need JDK 25, Spring AOT and Docker).
      # .svelte files are not analyzed by CodeQL, the TypeScript modules are.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin, javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: ${{ runner.temp }}/codeql
      # Every alert of the analysis is printed below and listed in the Security tab. A high or critical result
      # (security-severity >= 7.0) blocks while code scanning reports its alert as open; a false positive is dismissed
      # by a maintainer in GitHub (with a reason), never silenced in the repository. On a pull request, code scanning
      # only tracks the alerts of the changed files: the other results are listed and judged on main, where every high
      # result must be known to the API (an unknown one blocks rather than passes).
      - name: Summarize
        id: summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SARIF_DIR: ${{ runner.temp }}/codeql
          ALERTS_FILE: ${{ runner.temp }}/codeql-alerts.jsonl
        run: |
          gh api --paginate --jq '.[]' \
            "repos/$REPOSITORY/code-scanning/alerts?ref=$REF&tool_name=CodeQL&per_page=100" > "$ALERTS_FILE"
          python3 - <<'PY'
          import glob, json, os, sys

          HIGH = 7.0
          states = {}
          for line in open(os.environ["ALERTS_FILE"], encoding="utf-8"):
              alert = json.loads(line)
              location = alert["most_recent_instance"]["location"]
              states[(alert["rule"]["id"], location["path"], location.get("start_line"))] = alert["state"]
          print(f"Code scanning knows {len(states)} alert(s) on this ref")

          parts, blocking = [], []
          for path in sorted(glob.glob(os.path.join(os.environ["SARIF_DIR"], "*.sarif"))):
              for run in json.load(open(path, encoding="utf-8")).get("runs", []):
                  rules = {}
                  for component in [run["tool"]["driver"], *run["tool"].get("extensions", [])]:
                      for rule in component.get("rules", []):
                          rules[rule["id"]] = float(rule.get("properties", {}).get("security-severity", 0))
                  results = run.get("results", [])
                  language = os.path.basename(path).removesuffix(".sarif")
                  for result in results:
                      location = result["locations"][0]["physicalLocation"]
                      key = (result.get("ruleId"), location["artifactLocation"]["uri"], location.get("region", {}).get("startLine"))
                      severity = rules.get(key[0], 0)
                      state = states.get(key, "unknown")
                      print(f"{language}: {key[0]} (security-severity {severity}) {key[1]}:{key[2]} [{state}]")
                      unknown_blocks = os.environ["EVENT"] != "pull_request"
                      if severity >= HIGH and (state == "open" or (state == "unknown" and unknown_blocks)):
                          blocking.append(f"{key[0]} {key[1]}:{key[2]} [{state}]")
                  parts.append(f"{language} {len(results)}")

          summary = (
              f"CodeQL: alerts {' · '.join(parts)} · {len(blocking)} blocking high+" if parts else "CodeQL: no result"
          )
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\n")
          if blocking or not parts:
              print("Blocking:", *blocking, sep="\n  ")
              sys.exit("High or critical CodeQL alerts (or no analysis): fix them, or dismiss a false positive in GitHub")
          PY
      - name: Upload the SARIF reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql/
          if-no-files-found: ignore
          retention-days: 7

  frontend-lighthouse:
    name: Frontend Lighthouse
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the npm version pinned by packageManager
        working-directory: frontend
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Vite build
        working-directory: frontend
        run: npm run build
      # The SPA and a fake API (lighthouse/fake-api.mjs): one server signed out (login page), one signed in.
      - name: Start the servers
        working-directory: frontend
        run: |
          node lighthouse/server.mjs build 4173 "$RUNNER_TEMP/api-requests.log" &
          node lighthouse/server.mjs build 4174 "$RUNNER_TEMP/api-requests.log" --signed-in &
          for port in 4173 4174; do
            for _ in $(seq 1 30); do curl -fsS -o /dev/null "http://localhost:$port/login" && break; sleep 1; done
          done
      # Accessibility and best practices >= 0.9 on every page (lighthouserc.json); Chrome is preinstalled.
      - name: Lighthouse CI
        id: lighthouse
        working-directory: frontend
        run: npx --yes "@lhci/cli@${LHCI_CLI_VERSION}" autorun
      # A page that failed to load its data would still score well: every page must have fetched it.
      - name: Pages rendered their data
        working-directory: frontend
        env:
          REQUEST_LOG: ${{ runner.temp }}/api-requests.log
        run: |
          cat "$REQUEST_LOG"
          if grep -v ' 200$' "$REQUEST_LOG" | grep -v '^POST '; then
            echo "Unexpected API errors while auditing" >&2
            exit 1
          fi
          for path in /api/v1/podcasts /api/v1/podcasts/mon-podcast /api/v1/podcasts/mon-podcast/api-tokens \
            /api/v1/mon-podcast/episodes /api/v1/mon-podcast/episodes/ep-2 /api/v1/admin-users; do
            grep -q "^GET $path 200$" "$REQUEST_LOG" || { echo "No page fetched $path" >&2; exit 1; }
          done
      # Keyboard and screen reader journeys (focus, status messages, 412/503, error page) and axe-core
      # on every page, in a real browser on the same build and fake API (own servers, playwright.config.ts).
      - name: Accessibility journeys (Playwright, axe-core)
        id: journeys
        if: ${{ !cancelled() }}
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the journey traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-journeys
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize
        id: summary
        if: always()
        env:
          MANIFEST: frontend/.lighthouseci/reports/manifest.json
          JOURNEYS: frontend/test-results/e2e.json
        run: |
          python3 - <<'PY'
          import json, os

          if os.path.isfile(os.environ["JOURNEYS"]):
              stats = json.load(open(os.environ["JOURNEYS"], encoding="utf-8"))["stats"]
              journeys = f"journeys: {stats['expected']} passed, {stats['unexpected']} failed"
          else:
              journeys = "journeys: no report"
          if os.path.isfile(os.environ["MANIFEST"]):
              runs = [run for run in json.load(open(os.environ["MANIFEST"], encoding="utf-8")) if run.get("isRepresentativeRun")]
              def lowest(category):
                  return round(100 * min(run["summary"][category] for run in runs))
              summary = (
                  f"{len(runs)} page(s) · lowest scores: accessibility {lowest('accessibility')},"
                  f" best practices {lowest('best-practices')}, performance {lowest('performance')}"
              )
          else:
              summary = "Lighthouse: no report"
          summary = f"{summary} · {journeys}"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\n")
          PY

  backend-image:
    name: Backend native image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      image-size-bytes: ${{ steps.summary.outputs.image-size-bytes }}
    env:
      IMAGE: bergacast-backend:ci
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: smoke-test-password
      CORS_ORIGIN: https://admin.example.test
      # S3Mock: S3-compatible, accepts any credentials, objects publicly readable at MEDIA_URL (path-style).
      STORAGE_ENDPOINT: http://localhost:9090
      MEDIA_URL: http://localhost:9090/bergacast
    services:
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: bergacast
        ports:
          - 9090:9090
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bergacast
          POSTGRES_USER: bergacast
          POSTGRES_PASSWORD: bergacast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bergacast -d bergacast"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the native image (not pushed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max
      # The backend no longer migrates the database: the migration image does, as the job of the platform does it.
      - name: Build the migration image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: migration
          platforms: linux/amd64
          push: false
          load: true
          tags: bergacast-migration:ci
          cache-from: type=gha,scope=migration-image
          cache-to: type=gha,scope=migration-image,mode=max
      # The migration job also creates the administrator the smoke test logs in as.
      - name: Migrate the database
        run: >-
          docker run --rm --network host
          -e BERGACAST_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bergacast
          -e BERGACAST_DATASOURCE_USERNAME=bergacast
          -e BERGACAST_DATASOURCE_PASSWORD=bergacast
          -e BERGACAST_ADMIN_USERNAME="$ADMIN_USERNAME"
          -e BERGACAST_ADMIN_PASSWORD="$ADMIN_PASSWORD"
          bergacast-migration:ci
      - name: Start the image against PostgreSQL and the object storage
        id: start
        run: |
          docker run -d --name backend --network host \
            -e PORT=8080 \
            -e BERGACAST_STORAGE_ENDPOINT="$STORAGE_ENDPOINT" \
            -e BERGACAST_STORAGE_BUCKET=bergacast \
            -e BERGACAST_STORAGE_ACCESS_KEY=ci \
            -e BERGACAST_STORAGE_SECRET_KEY=ci \
            -e BERGACAST_MEDIA_BASE_URL="$MEDIA_URL" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bergacast \
            -e BERGACAST_JWT_SECRET="$(openssl rand -base64 48)" \
            -e BERGACAST_CORS_ALLOWED_ORIGINS="$CORS_ORIGIN" \
            -e BERGACAST_PUBLIC_BASE_URL=http://localhost:8080 \
            "$IMAGE"
      - name: Smoke test
        id: smoke
        env:
          BASE_URL: http://localhost:8080
        run: backend/scripts/smoke-test.sh
      - name: Container logs
        if: always() && steps.start.outcome == 'success'
        run: docker logs backend
      # Only the Debian packages of the distroless base are visible here (the Java dependencies are scanned in the
      # jar by backend-dependencies).
      - name: Trivy
        id: trivy
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: image
          target: ${{ env.IMAGE }}
          summary-file: ${{ runner.temp }}/trivy.summary
      - name: Summarize
        id: summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          bytes=""
          if [ "$BUILD_OUTCOME" = "success" ] && bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE" 2>/dev/null); then
            summary="image size $(numfmt --to=iec-i --suffix=B "$bytes")"
            case "$SMOKE_OUTCOME" in
              success)
                memory=$(docker stats --no-stream --format '{{.MemUsage}}' backend 2>/dev/null | cut -d/ -f1 | tr -d ' ')
                summary="$summary · smoke test passed · memory after test ${memory:-unknown}" ;;
              failure) summary="$summary · smoke test failed" ;;
              *) summary="$summary · smoke test not run" ;;
            esac
          else
            bytes=""
            summary="image not built"
          fi
          if [ -f "$RUNNER_TEMP/trivy.summary" ]; then
            summary="$summary · $(cat "$RUNNER_TEMP/trivy.summary")"
          fi
          echo "$summary"
          {
            echo "summary=$summary"
            echo "image-size-bytes=$bytes"
          } >> "$GITHUB_OUTPUT"

  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      image-size-bytes: ${{ steps.summary.outputs.image-size-bytes }}
    env:
      IMAGE: bergacast-frontend:ci
      API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max
      - name: Check the served SPA
        id: smoke
        run: |
          docker run -d --name frontend -p 8080:9000 -e PORT=9000 -e BERGACAST_API_URL="$API_URL" "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/config.js | grep -F "\"$API_URL\""
          curl -fsS http://localhost:8080/podcasts/demo | grep -F '<script src="/config.js"></script>'
          curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -i '^cache-control: no-cache'
          curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -i '^x-robots-tag: noindex, nofollow'
          curl -fsS http://localhost:8080/robots.txt | grep -qx 'Disallow: /'
          # A configuration that is not a plain origin must stop the container.
          # A newline would let a second line inject JavaScript into config.js.
          for invalid_url in 'javascript:alert(1)' "$(printf 'https://a.example\n"};alert(1);//')"; do
            if docker run --rm -e BERGACAST_API_URL="$invalid_url" "$IMAGE"; then
              echo "Invalid BERGACAST_API_URL accepted: $invalid_url" >&2
              exit 1
            fi
          done
      - name: Trivy
        id: trivy
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: image
          target: ${{ env.IMAGE }}
          summary-file: ${{ runner.temp }}/trivy.summary
      - name: Summarize
        id: summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          bytes=""
          if [ "$BUILD_OUTCOME" = "success" ] && bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE" 2>/dev/null); then
            summary="image size $(numfmt --to=iec-i --suffix=B "$bytes")"
            case "$SMOKE_OUTCOME" in
              success)
                memory=$(docker stats --no-stream --format '{{.MemUsage}}' frontend 2>/dev/null | cut -d/ -f1 | tr -d ' ')
                summary="$summary · serving checks passed · memory ${memory:-unknown}" ;;
              failure) summary="$summary · serving checks failed" ;;
              *) summary="$summary · serving checks not run" ;;
            esac
          else
            bytes=""
            summary="image not built"
          fi
          if [ -f "$RUNNER_TEMP/trivy.summary" ]; then
            summary="$summary · $(cat "$RUNNER_TEMP/trivy.summary")"
          fi
          echo "$summary"
          {
            echo "summary=$summary"
            echo "image-size-bytes=$bytes"
          } >> "$GITHUB_OUTPUT"

  migration-check:
    name: Migration lint and tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: gradle
          cache-dependency-path: |
            migration/*.gradle*
            migration/gradle/wrapper/gradle-wrapper.properties
      # Spotless, Checkstyle (rules of the backend) and the tests (Testcontainers PostgreSQL: empty database, database
      # migrated by Flyway before, idempotence).
      - name: Check
        working-directory: migration
        run: ./gradlew --console=plain check
      - name: Summarize
        id: summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          tests = failed = skipped = 0
          files = glob.glob("migration/build/test-results/test/*.xml")
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for suite in [root] if root.tag == "testsuite" else root.iter("testsuite"):
                  tests += int(suite.get("tests", 0))
                  failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  skipped += int(suite.get("skipped", 0))
          summary = f"{tests - failed - skipped} passed, {failed} failed, {skipped} skipped" if files else "no test report"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\n")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-test-reports
          path: |
            migration/build/reports/tests/test/
            migration/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

  migration-dependencies:
    name: Migration dependencies (CVE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
          cache: gradle
          cache-dependency-path: |
            migration/*.gradle*
            migration/gradle/wrapper/gradle-wrapper.properties
      # The jars the image runs, Liquibase and its dependencies included.
      - name: Runtime dependencies
        working-directory: migration
        run: ./gradlew --console=plain installDist
      - name: Trivy
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: rootfs
          target: migration/build/install/bergacast-migration/lib
          summary-file: ${{ runner.temp }}/trivy.summary
      - name: Summarize
        id: summary
        if: always()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/trivy.summary
        run: |
          summary=$(cat "$SUMMARY_FILE" 2>/dev/null || echo "Trivy: not run")
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

  migration-image:
    name: Migration image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      image-size-bytes: ${{ steps.summary.outputs.image-size-bytes }}
    env:
      IMAGE: bergacast-migration:ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bergacast
          POSTGRES_USER: bergacast
          POSTGRES_PASSWORD: bergacast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bergacast -d bergacast"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: migration
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=migration-image
          cache-to: type=gha,scope=migration-image,mode=max
      # Run like the job of the platform: an environment, a database, an exit status. The second run changes nothing.
      - name: Migrate the database twice
        id: migrate
        run: |
          for run in 1 2; do
            docker run --rm --network host \
              -e BERGACAST_DATASOURCE_URL=jdbc:postgresql://localhost:5432/bergacast \
              -e BERGACAST_DATASOURCE_USERNAME=bergacast \
              -e BERGACAST_DATASOURCE_PASSWORD=bergacast \
              "$IMAGE"
          done
          tables=$(PGPASSWORD=bergacast psql -h localhost -U bergacast -d bergacast -tA \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('podcast', 'episode', 'audio_file')")
          [ "$tables" = 3 ]
      - name: A missing configuration must fail the job
        run: |
          if docker run --rm "$IMAGE"; then
            echo "The image migrated without any database configured" >&2
            exit 1
          fi
      - name: Trivy
        id: trivy
        if: always() && steps.build.outcome == 'success'
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: image
          target: ${{ env.IMAGE }}
          summary-file: ${{ runner.temp }}/trivy.summary
      - name: Summarize
        id: summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
        run: |
          bytes=""
          if [ "$BUILD_OUTCOME" = "success" ] && bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE" 2>/dev/null); then
            summary="image size $(numfmt --to=iec-i --suffix=B "$bytes")"
            case "$MIGRATE_OUTCOME" in
              success) summary="$summary · migration run twice" ;;
              failure) summary="$summary · migration failed" ;;
              *) summary="$summary · migration not run" ;;
            esac
          else
            bytes=""
            summary="image not built"
          fi
          if [ -f "$RUNNER_TEMP/trivy.summary" ]; then
            summary="$summary · $(cat "$RUNNER_TEMP/trivy.summary")"
          fi
          echo "$summary"
          {
            echo "summary=$summary"
            echo "image-size-bytes=$bytes"
          } >> "$GITHUB_OUTPUT"

  report:
    name: PR report
    needs:
      - pr-title
      - release-scripts
      - backend-lint
      - backend-test
      - backend-build
      - openapi-lint
      - frontend-lint
      - frontend-test
      - frontend-build
      - backend-image
      - frontend-image
      - backend-dependencies
      - frontend-dependencies
      - migration-check
      - migration-image
      - migration-dependencies
      - secrets
      - codeql
      - frontend-lighthouse
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # On pull requests from forks GITHUB_TOKEN is read-only: the comment cannot be posted, the script then only
      # logs a warning and the report stays available in the job summary. Never switch to pull_request_target.
      - name: Post or update the PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const marker = '<!-- bergacast-ci-report -->';
            const checks = [
              ['pr-title', 'PR title (Conventional Commits)'],
              ['release-scripts', 'Release scripts (ShellCheck, bats)'],
              ['backend-lint', 'Backend lint (Spotless, Checkstyle)'],
              ['backend-test', 'Backend tests'],
              ['backend-build', 'Backend build (bootJar)'],
              ['openapi-lint', 'OpenAPI lint (Spectral)'],
              ['frontend-lint', 'Frontend lint (Prettier, ESLint, svelte-check)'],
              ['frontend-test', 'Frontend tests'],
              ['frontend-build', 'Frontend build'],
              ['backend-image', 'Backend native image (GraalVM, smoke test, Trivy)'],
              ['frontend-image', 'Frontend image (static-web-server, Trivy)'],
              ['migration-check', 'Migration lint and tests (Liquibase, Testcontainers)'],
              ['migration-image', 'Migration image (run twice, Trivy)'],
              ['backend-dependencies', 'Backend dependencies (Trivy)'],
              ['migration-dependencies', 'Migration dependencies (Trivy)'],
              ['frontend-dependencies', 'Frontend dependencies (npm audit)'],
              ['secrets', 'Secrets (gitleaks)'],
              ['codeql', 'CodeQL (Java, TypeScript, workflows)'],
              ['frontend-lighthouse', 'Frontend Lighthouse (≥ 90) and accessibility journeys (Playwright, axe)'],
            ];
            const icons = { success: '✅', failure: '❌', cancelled: '⚠️', skipped: '⚠️' };
            try {
              let needs = {};
              try {
                needs = JSON.parse(process.env.NEEDS || '{}');
              } catch (error) {
                core.warning(`Cannot parse job results: ${error.message}`);
              }
              const results = checks.map(([id]) => needs[id]?.result ?? 'unknown');
              const status = results.includes('failure')
                ? '❌ Some checks failed'
                : results.every((result) => result === 'success')
                  ? '✅ All checks passed'
                  : '⚠️ Some checks were cancelled or skipped';
              const cell = (text) => String(text || '—').replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');
              const rows = checks.map(([id, label], index) => {
                const result = results[index];
                return `| ${icons[result] ?? '❔'} | ${label} | ${cell(needs[id]?.outputs?.summary || result)} |`;
              });
              const sha = (context.payload.pull_request?.head?.sha ?? context.sha).slice(0, 7);
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = [
                marker,
                `## Bergacast CI — ${status}`,
                '',
                '| | Check | Summary |',
                '|:-:|---|---|',
                ...rows,
                '',
                `Commit \`${sha}\` · [workflow run](${runUrl})`,
              ].join('\n');

              await core.summary.addRaw(body).write();

              const issue_number = context.payload.pull_request?.number;
              if (!issue_number) {
                core.warning('No pull request in the event payload, comment skipped.');
                return;
              }
              const { owner, repo } = context.repo;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              // Only our own comment: anyone can post a comment containing the marker.
              const existing = comments.find(
                (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                core.info(`Updated comment ${existing.html_url}`);
              } else {
                const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`Created comment ${data.html_url}`);
              }
            } catch (error) {
              // The job reports results, it does not judge them: never fail because of the comment.
              core.warning(`Cannot publish the CI report comment: ${error.message}`);
            }
