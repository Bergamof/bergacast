name: Release images

# Publishes the backend (GraalVM native) and frontend (static SPA) images to the Scaleway Container Registry:
# - every commit of main once CI is green: tags `edge` and `sha-<short sha>`;
# - every version tag vX.Y.Z (on a commit already verified on main): tags `X.Y.Z`, `X.Y`, `latest` and `sha-<short sha>`.
# Required configuration: secret SCW_SECRET_KEY (an IAM API key allowed to push to the registry namespace).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: rg.fr-par.scw.cloud
  REGISTRY_NAMESPACE: bergacast

jobs:
  publish:
    name: Publish ${{ matrix.module }} image
    # Only CI runs of pushes to main that succeeded (not pull requests targeting main).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend]
    steps:
      - name: Resolve the commit to publish
        id: commit
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/bergacast-${{ matrix.module }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          # Other OCI labels (source, licenses, created…) come from the repository.
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.module }}
          # Scaleway Serverless Containers only run linux/amd64 images.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same cache scope as the CI image jobs: the commit verified by CI is not compiled again.
          cache-from: type=gha,scope=${{ matrix.module }}-image
          cache-to: type=gha,scope=${{ matrix.module }}-image,mode=max
      - name: Summarize
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### bergacast-${{ matrix.module }}"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
