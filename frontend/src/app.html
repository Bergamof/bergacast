<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="robots" content="noindex" />
		<script src="/config.js"></script>
		%sveltekit.head%
		<style>
			/* Shown until the first page has loaded its data (a cold start of the backend takes seconds). */
			.app-loading {
				margin: 2.5rem 1rem;
				font-family: system-ui, sans-serif;
				text-align: center;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<p id="app-loading" class="app-loading" role="status">Chargement de Bergacast…</p>
		<script>
			// Still here after a while: the start failed (e.g. a file of a previous version, gone).
			setTimeout(() => {
				const loading = document.getElementById('app-loading');
				if (loading) {
					loading.textContent =
						'Le chargement est anormalement long. Si rien ne s’affiche, rechargez la page.';
				}
			}, 30000);
		</script>
		<noscript
			><p class="app-loading">L’administration de Bergacast nécessite JavaScript.</p></noscript
		>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
