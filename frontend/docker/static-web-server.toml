# static-web-server settings of the admin SPA image (https://static-web-server.net/configuration/config-file/).
# Root, port and fallback page are given by docker-entrypoint.sh.

[general]
log-level = "info"
health = true
compression = false
compression-static = true
directory-listing = false
ignore-hidden-files = true
security-headers = true
# Explicit rules below instead of the default per-extension cache durations.
cache-control-headers = false

[advanced]

# Everything revalidates by default: the index, client routes and the runtime configuration change on each deployment.
# The administration is never indexed by search engines (robots.txt disallows crawling as well).
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Cache-Control = "no-cache"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
X-Robots-Tag = "noindex, nofollow"

# Fingerprinted build output never changes.
[[advanced.headers]]
source = "/_app/immutable/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
